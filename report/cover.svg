  <text x="70" y="225" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="29">Supervision et administration d'un HomeLab segmenté</text>
  <path d="M245 395 H430 M560 395 H745 M875 395 H1030" stroke="url(#accent)" stroke-width="5" stroke-dasharray="12 10"/>
  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g transform="translate(70 320)">
