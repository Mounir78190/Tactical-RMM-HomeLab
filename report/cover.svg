  <rect x="70" y="530" width="1065" height="2" fill="#334155"/>
  <text x="70" y="575" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="21">POC fonctionnel • TLS • DNS-01 • Windows • Supervision ICMP</text>
