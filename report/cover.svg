      <path d="M70 42 l18 -12 18 12 v24 c0 20-18 31-18 31S70 86 70 66z" fill="none" stroke="#7dd3fc" stroke-width="5"/>
      <text x="88" y="125" fill="#fff" font-size="21" font-weight="600">pfSense</text>
    </g>
    <g transform="translate(430 320)">
      <rect width="175" height="150" rx="18" fill="#132f4c" stroke="#8b5cf6" stroke-width="2"/>
      <rect x="55" y="36" width="65" height="50" rx="5" fill="none" stroke="#c4b5fd" stroke-width="5"/>
      <path d="M70 102 h35" stroke="#c4b5fd" stroke-width="5"/>
      <text x="88" y="125" fill="#fff" font-size="21" font-weight="600">KVM / Debian</text>
    </g>
    <g transform="translate(745 320)">
      <rect width="175" height="150" rx="18" fill="#103b4a" stroke="#22d3ee" stroke-width="3"/>
      <circle cx="88" cy="62" r="28" fill="none" stroke="#67e8f9" stroke-width="6"/>
      <path d="M88 42 v20 l15 10" fill="none" stroke="#67e8f9" stroke-width="6" stroke-linecap="round"/>
      <text x="88" y="125" fill="#fff" font-size="21" font-weight="700">Tactical RMM</text>
    </g>
    <g transform="translate(1025 320)">
      <rect width="110" height="150" rx="18" fill="#132f4c" stroke="#22c55e" stroke-width="2"/>
      <circle cx="55" cy="61" r="26" fill="none" stroke="#86efac" stroke-width="5"/>
      <path d="M43 61 l8 8 17-19" fill="none" stroke="#86efac" stroke-width="5" stroke-linecap="round"/>
      <text x="55" y="125" fill="#fff" font-size="18" font-weight="600">Agents</text>
